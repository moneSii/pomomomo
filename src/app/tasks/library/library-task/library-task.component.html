<div class="item">
  <div class="handle" cdkDragHandle>H</div>
  <p class="category">{{ task().category }}</p>
  <h1 class="title" [class.completed]="this.task().completed">
    {{ task().title }}
  </h1>
  <button (click)="onClick('completed')" class="complete">Complete</button>
  <button (click)="onClick('delete')" class="delete">Delete</button>
  <input [(ngModel)]="task().completed" class="status" type="checkbox" />
</div>
