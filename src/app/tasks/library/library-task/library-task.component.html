<div class="handle" cdkDragHandle>
  <img class="image-handle" src="/icons/draggable.png" />
</div>
<p class="category">{{ task().category }}</p>
<h1 class="title" [class.completed]="this.task().completed">
  {{ task().title }}
</h1>
<div (click)="onClick('completed')" class="complete">
  <img class="icon" src="/icons/checkmark.png" />
</div>
<div (click)="onClick('delete')" class="delete">
  <img class="icon" src="/icons/cross.png" />
</div>
<input [(ngModel)]="task().completed" class="status" type="checkbox" />
