<div class="item">
  <input [(ngModel)]="task().completed" type="checkbox" />
  <div class="handle" cdkDragHandle>H</div>
  <p class="category">{{ task().category }}</p>
  <h1 class="title">{{ task().title }}</h1>
  <p class="content">{{ task().content }}</p>
  <button (click)="onClick()">Delete</button>
</div>
