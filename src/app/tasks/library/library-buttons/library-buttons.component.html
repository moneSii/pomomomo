<div class="sort">
  <label>Sort</label>
  <div class="button-group">
    <button (click)="onClickSort('category')">Sort By: Category</button>
    <button (click)="onClickSort('completed')">Sort By: Completed</button>
    <button (click)="onClickSort('dateCreation')">Sort By: Date Created</button>
  </div>
</div>
<div class="delete">
  <label>Delete</label>
  <div class="button-group">
    <button (click)="onClickDelete('completed')">Delete Completed Tasks</button>
    <button (click)="onClickDelete('all')">Delete All Tasks</button>
  </div>
</div>
