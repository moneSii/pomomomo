<div class="backdrop" (click)="onClose()"></div>
<dialog class="box" [class]="colorPrimary()" open>
  <div class="container">
    <div class="header">
      <app-mini-timer class="header-item mini-timer" />
      <app-library-buttons class="library-buttons" />
    </div>
    <div class="library">
      <div
        class="task-list"
        cdkDropList
        (cdkDropListDropped)="drop($event)"
        cdkScrollable
      >
        <div
          class="task-item task-add"
          [class]="colorSecondary()"
          (click)="onClick()"
        >
          + Add new Task! +
        </div>
        @for (task of list(); track task.id) {
        <app-library-task
          [task]="task"
          cdkDrag
          class="task-item"
          [class]="colorSecondary()"
          animate.enter="enter-animation"
          animate.leave="leave-animation"
        />
        }
      </div>
    </div>
  </div>
</dialog>
