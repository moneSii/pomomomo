@if (this.display()){
<div class="backdrop" (click)="closeForm()"></div>
<dialog open class="form-box">
  <form [formGroup]="form">
    <p>Select Your Pomodoro timer Variables</p>

    <div class="control">
      <label>Minutes</label>
      <input
        id="workMinutes"
        formControlName="minutes"
        appSelect
        appNumbersOnly
        appLessThan
        [upperLimit]="60"
        [lowerLimit]="1"
      />
    </div>

    <div class="control">
      <label>short break</label>
      <input
        id="shortBreakMinutes"
        formControlName="short"
        appSelect
        appNumbersOnly
        appLessThan
        [upperLimit]="60"
        [lowerLimit]="1"
      />

      <label>long break</label>
      <input
        id="longBreakMinutes"
        formControlName="long"
        appNumbersOnly
        appSelect
        appNumbersOnly
        appLessThan
        [upperLimit]="60"
        [lowerLimit]="1"
      />
    </div>

    <div class="control">
      <label>intervals</label>
      <input
        id="workIntervals"
        formControlName="intervals"
        appNumbersOnly
        appSelect
        appNumbersOnly
        appLessThan
        [upperLimit]="60"
        [lowerLimit]="1"
      />
    </div>

    <div class="control">
      <label>AutoCycle</label>
      <input type="checkbox" formControlName="cycle" />
    </div>
  </form>
</dialog>
}
