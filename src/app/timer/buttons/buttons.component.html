<div class="container">
  @if (!this.timerStatus){
  <button (click)="onStart()">
    <img src="/icons/play.svg" />
  </button>
  } @else {
  <button (click)="onPause()">
    <img src="/icons/pause.svg" /></button
  >}
  <button (click)="onSkip()">
    <img src="/icons/skip.svg" />
  </button>
  <button (click)="onReset()">
    <img src="/icons/reset.svg" />
  </button>
  <button (click)="onToggleDisplayVars()">
    <img src="/icons/settingBUTTON.svg" />
  </button>
</div>
