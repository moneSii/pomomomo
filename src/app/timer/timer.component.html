<div class="timer-box">
    <div>
        <p>TIMER</p>
        <p>{{this.counter*1000| date:'mm:ss'}}</p>
    </div>
    <div>
        <button (click)="onStart()">Start</button>
        <button (click)="onPause()">Pause</button>
        <button (click)="onReset()">Reset</button>
        <button (click)="onDebugCheck()">Check</button>
    </div>

</div>
<div class="form-box">
    <form [formGroup]="form">
        <p>Select Your Pomodoro timer Variables</p>

        <div class="control">
            <label>Minutes</label>
            <input id="workMinutes" formControlName="minutes" (keypress)="($event.charCode >= 48 && $event.charCode < 58)">
        </div>

        <div class="control" formGroupName="breaks">
            <label>short break</label>
            <input id="shortBreakMinutes" formControlName="short" (keypress)="($event.charCode >= 48 && $event.charCode < 58)">

            <label>long break</label>
            <input id="longBreakMinutes" formControlName="long" (keypress)="($event.charCode >= 48 && $event.charCode < 58)">
        </div>

        <div class="control">
            <label>intervals</label>
            <input id="workIntervals" formControlName="intervals" (keypress)="($event.charCode >= 48 && $event.charCode < 58)">
        </div>

    </form>
</div>
