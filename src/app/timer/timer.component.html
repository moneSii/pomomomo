<div class="timer">
  <div class="timer__display">
    <p class="timer--stopwatch">{{ this.counter | minuteTime : "mm:ss:S" }}</p>
    <h2 class="timer--intervalCount">
      Work Done: {{ this.curInterval() + "/" + this.maxInterval() }}
    </h2>
  </div>
  <ng-content select="app-buttons"></ng-content>
  <ng-content select="app-variables"></ng-content>
</div>
