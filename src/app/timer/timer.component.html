<div
  class="body"
  [ngClass]="{
    'work-main': this.timeType(),
    'long-main': !this.timeType() && this.maxInterval() === this.curInterval(),
    'short-main': !this.timeType() && this.maxInterval() !== this.curInterval()
  }"
>
  <div
    class="container"
    [ngClass]="{
      'work-secondary': this.timeType(),
      'long-secondary':
        !this.timeType() && this.maxInterval() === this.curInterval(),
      'short-secondary':
        !this.timeType() && this.maxInterval() !== this.curInterval()
    }"
  >
    <p class="timer">{{ this.counter | async | minuteTime : "mm:ss" }}</p>
    <p class="interval">
      Work Done: {{ this.curInterval() + "/" + this.maxInterval() }}
    </p>
  </div>
  <ng-content select="app-buttons"></ng-content>
  <ng-content select="app-variables"></ng-content>
</div>
