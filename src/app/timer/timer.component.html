<div class="body">
  <div class="container">
    <p class="timer">{{ this.counter | async | minuteTime : "mm:ss" }}</p>
    <p class="interval">
      Work Done: {{ this.curInterval() + "/" + this.maxInterval() }}
    </p>
  </div>
  <ng-content select="app-buttons"></ng-content>
  <ng-content select="app-variables"></ng-content>
</div>
