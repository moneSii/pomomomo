<div class="container" [ngClass]="currentColor()">
  <button (click)="onStart()">
    <img src="/icons/play.png" />
  </button>
  <button (click)="onPause()">
    <img src="/icons/pause.png" />
  </button>
  <button (click)="onSkip()">
    <img src="/icons/forward.png" />
  </button>
  <button (click)="onReset()">
    <img src="/icons/reset.png" />
  </button>
  <button (click)="onOpenForm()">
    <img src="/icons/menu.png" />
  </button>
</div>
