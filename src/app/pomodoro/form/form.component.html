@if (this.display()){
<div class="backdrop" (click)="closeForm()"></div>
<dialog open appColor type="primary">
  <h1>Adjust Timer!</h1>
  <form [formGroup]="form">
    <div class="form-item">
      <label>Minutes</label>
      <input
        title="1-60"
        formControlName="minutes"
        appSelect
        appNumbersOnly
        appLessThan
        [upperLimit]="60"
        [lowerLimit]="1"
      />
    </div>
    <div class="form-item">
      <label>Short Break</label>
      <input
        title="1-60"
        formControlName="short"
        appSelect
        appNumbersOnly
        appLessThan
        [upperLimit]="60"
        [lowerLimit]="1"
      />
    </div>
    <div class="form-item">
      <label>Long Break</label>
      <input
        title="1-60"
        formControlName="long"
        appSelect
        appNumbersOnly
        appLessThan
        [upperLimit]="60"
        [lowerLimit]="1"
      />
    </div>
    <div class="form-item">
      <label>Intervals</label>
      <input
        title="1-60"
        formControlName="intervals"
        appSelect
        appNumbersOnly
        appLessThan
        [upperLimit]="60"
        [lowerLimit]="1"
      />
    </div>
    <div class="form-item">
      <label>AutoCycle</label>
      <input type="checkbox" formControlName="cycle" />
    </div>
  </form>
</dialog>
}
